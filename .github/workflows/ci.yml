name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

jobs:
  # The dependency audit is its own job on purpose. It used to run first inside
  # `verify`, so a failing audit aborted the job and every functional step was
  # reported as skipped — a red CI with no verification evidence at all, and no
  # way for a reviewer to tell whether the branch was healthy. Splitting keeps
  # the audit required and visible while letting the real checks always run.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run build

  # Vercel deploys the web from master on its own; this job does the same for the Worker so both ship from one merge.
  # Migrations run first, so the running Worker must tolerate the new schema for the minute until the deploy lands.
  deploy-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # Never two deploys at once, and never cancel one halfway through a migration. GitHub keeps one queued run and
    # drops older queued ones, which is fine: the newest master commit deploys everything before it.
    concurrency:
      group: worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      # The token is passed only to the wrangler steps, never to `npm ci` and its install scripts.
      - run: npm ci
      - run: npm run db:migrate:remote -w @mis-servicios/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy -w @mis-servicios/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
